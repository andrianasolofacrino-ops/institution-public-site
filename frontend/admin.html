<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-admin">
        <h1>Administration</h1>
        <span class="navbar-subtitle">Panneau administrateur</span>
        <div class="navbar-actions">
            <a href="dashboard.html" class="btn-profil">Mon espace</a>
            <button class="btn-logout" onclick="logout()">Se déconnecter</button>
        </div>
    </nav>

    <div class="container">

        <div id="msgAdmin" class="msg-retour"></div>

        <!-- STATS GLOBALES -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="adminTotal">0</div>
                <div class="stat-label">Total demandes</div>
            </div>
            <div class="stat-card stat-attente">
                <div class="stat-number" id="adminAttente">0</div>
                <div class="stat-label">En attente</div>
            </div>
            <div class="stat-card stat-encours">
                <div class="stat-number" id="adminEncours">0</div>
                <div class="stat-label">En cours</div>
            </div>
            <div class="stat-card stat-termine">
                <div class="stat-number" id="adminTermine">0</div>
                <div class="stat-label">Terminées</div>
            </div>
        </div>

        <!-- BARRE ACTION -->
        <div class="barre-action">
            <h2>Toutes les demandes</h2>
            <div class="admin-filtres">
                <label for="adminFiltreStatut" class="label-sr">Filtrer par statut</label>
                <select
                    id="adminFiltreStatut"
                    onchange="filtrerAdmin()"
                    class="filtre-select"
                    title="Filtrer par statut"
                    aria-label="Filtrer par statut">
                    <option value="">Tous les statuts</option>
                    <option value="En attente">En attente</option>
                    <option value="En cours">En cours</option>
                    <option value="Terminée">Terminée</option>
                    <option value="Refusée">Refusée</option>
                </select>
                <label for="adminSearch" class="label-sr">Rechercher</label>
                <input
                    type="text"
                    id="adminSearch"
                    placeholder="Rechercher..."
                    oninput="filtrerAdmin()"
                    class="search-input search-admin"
                    aria-label="Rechercher une demande">
            </div>
        </div>

        <!-- TABLE DES DEMANDES -->
        <div class="table-wrapper">
            <table class="admin-table" id="adminTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Utilisateur</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Statut</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="7" class="table-chargement">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- MODALE CHANGEMENT STATUT -->
    <div id="modaleStatut" class="modale">
        <div class="modale-contenu">
            <h3>Changer le statut</h3>
            <input type="hidden" id="statutDemandeId">
            <p id="statutDemandeTitre" class="statut-demande-titre"></p>
            <label for="nouveauStatut">Nouveau statut</label>
            <select id="nouveauStatut" title="Choisir le nouveau statut" aria-label="Nouveau statut">
                <option value="En attente">En attente</option>
                <option value="En cours">En cours</option>
                <option value="Terminée">Terminée</option>
                <option value="Refusée">Refusée</option>
            </select>
            <div class="modale-actions">
                <button class="btn-annuler" onclick="fermerStatut()">Annuler</button>
                <button class="btn-sauvegarder" onclick="sauvegarderStatut()">Confirmer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
