<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-form">

    <div class="carte">

        <div class="carte-entete">
            <h2>Créer un compte</h2>
            <p>Remplissez le formulaire pour vous inscrire</p>
        </div>

        <form onsubmit="registerUser(event)">

            <label for="nom">Nom complet</label>
            <input type="text" id="nom" placeholder="Votre nom complet" required>

            <label for="email">Adresse email</label>
            <input type="email" id="email" placeholder="exemple@email.com" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="Choisissez un mot de passe" required minlength="4">

            <button type="submit" class="btn-submit-vert">Créer mon compte</button>

        </form>

        <div id="msgRegister" class="msg-retour"></div>

        <div class="lien-bas">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
        <div class="lien-bas">
            <a href="index.html">← Retour à l'accueil</a>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
