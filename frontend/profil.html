<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil — CommuneService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marianne:wght@400;500;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-app">

    <header class="topbar">
        <div class="topbar-brand">
            <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Ouvrir le menu" title="Menu">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>
            <a href="index.html" class="topbar-logo">
                <i class="bi bi-building-fill me-2" aria-hidden="true"></i>
                <span>CommuneService</span>
            </a>
        </div>
        <div class="topbar-actions">
            <div class="topbar-user" onclick="toggleUserMenu()">
                <div class="user-avatar" id="topbarAvatar" aria-hidden="true">?</div>
                <span class="user-name d-none d-md-inline" id="nomUtilisateur">...</span>
                <i class="bi bi-chevron-down ms-1 chevron-user" aria-hidden="true"></i>
                <div class="user-menu" id="userMenu">
                    <a href="profil.html" class="user-menu-item">
                        <i class="bi bi-person-circle" aria-hidden="true"></i>Mon profil
                    </a>
                    <div class="user-menu-divider"></div>
                    <button onclick="logout()" class="user-menu-item user-menu-logout" aria-label="Se déconnecter" title="Se déconnecter">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Se déconnecter
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav" aria-label="Navigation principale">
                <div class="sidebar-section-label">Principal</div>
                <a href="dashboard.html" class="sidebar-link">
                    <i class="bi bi-grid-fill" aria-hidden="true"></i><span>Tableau de bord</span>
                </a>
                <a href="demande.html" class="sidebar-link">
                    <i class="bi bi-file-earmark-plus-fill" aria-hidden="true"></i><span>Nouvelle demande</span>
                </a>
                <div class="sidebar-section-label mt-3">Mon compte</div>
                <a href="profil.html" class="sidebar-link active">
                    <i class="bi bi-person-circle" aria-hidden="true"></i><span>Mon profil</span>
                </a>
                <button onclick="logout()" class="sidebar-link sidebar-logout" aria-label="Se déconnecter" title="Se déconnecter">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Se déconnecter</span>
                </button>
            </nav>
        </aside>

        <main class="app-main">

            <div class="page-header">
                <div>
                    <h1 class="page-title">Mon profil</h1>
                    <p class="page-subtitle">Gérez vos informations personnelles</p>
                </div>
                <a href="dashboard.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Retour
                </a>
            </div>

            <div class="row g-4">

                <!-- COLONNE GAUCHE — avatar + infos -->
                <div class="col-lg-4">
                    <div class="profil-card">
                        <div class="profil-card-header">
                            <div class="profil-avatar" id="avatarInitiales" aria-hidden="true">?</div>
                            <div class="profil-nom" id="profilNom">Chargement...</div>
                            <div class="profil-email-text" id="profilEmail"></div>
                        </div>
                        <div class="p-3">
                            <div class="profil-status-box">
                                <i class="bi bi-shield-check-fill text-success" aria-hidden="true"></i>
                                <div>
                                    <div class="profil-status-title">Compte actif</div>
                                    <div class="profil-status-sub">Citoyen inscrit</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COLONNE DROITE — formulaires -->
                <div class="col-lg-8">

                    <div id="msgProfil" class="alert d-none mb-3" role="alert"></div>

                    <!-- Modifier nom -->
                    <div class="profil-section-card mb-4">
                        <div class="profil-section-header">
                            <i class="bi bi-person-fill" aria-hidden="true"></i>
                            Modifier le nom
                        </div>
                        <div class="profil-section-body">
                            <form onsubmit="modifierNom(event)" novalidate>
                                <label for="nouveauNom" class="form-label-gov">Nouveau nom complet</label>
                                <input
                                    type="text"
                                    id="nouveauNom"
                                    class="form-control form-control-gov"
                                    placeholder="Votre nom complet"
                                    required>
                                <div class="mt-3">
                                    <button type="submit" class="btn btn-gov">
                                        <i class="bi bi-check-lg me-1" aria-hidden="true"></i>
                                        Sauvegarder le nom
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Changer mot de passe -->
                    <div class="profil-section-card">
                        <div class="profil-section-header">
                            <i class="bi bi-key-fill" aria-hidden="true"></i>
                            Changer le mot de passe
                        </div>
                        <div class="profil-section-body">
                            <form onsubmit="changerMotDePasse(event)" novalidate>

                                <div class="mb-3">
                                    <label for="ancienMdp" class="form-label-gov">Mot de passe actuel</label>
                                    <div class="input-password-wrap">
                                        <input
                                            type="password"
                                            id="ancienMdp"
                                            class="form-control form-control-gov"
                                            placeholder="Mot de passe actuel"
                                            required>
                                        <button
                                            type="button"
                                            class="btn-toggle-pwd"
                                            onclick="togglePassword('ancienMdp', this)"
                                            aria-label="Afficher le mot de passe actuel"
                                            title="Afficher/Masquer">
                                            <i class="bi bi-eye-fill" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="nouveauMdp" class="form-label-gov">Nouveau mot de passe</label>
                                    <div class="input-password-wrap">
                                        <input
                                            type="password"
                                            id="nouveauMdp"
                                            class="form-control form-control-gov"
                                            placeholder="Nouveau mot de passe (min. 4 caractères)"
                                            required
                                            minlength="4">
                                        <button
                                            type="button"
                                            class="btn-toggle-pwd"
                                            onclick="togglePassword('nouveauMdp', this)"
                                            aria-label="Afficher le nouveau mot de passe"
                                            title="Afficher/Masquer">
                                            <i class="bi bi-eye-fill" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="confirmMdp" class="form-label-gov">Confirmer le nouveau mot de passe</label>
                                    <div class="input-password-wrap">
                                        <input
                                            type="password"
                                            id="confirmMdp"
                                            class="form-control form-control-gov"
                                            placeholder="Confirmer le mot de passe"
                                            required>
                                        <button
                                            type="button"
                                            class="btn-toggle-pwd"
                                            onclick="togglePassword('confirmMdp', this)"
                                            aria-label="Afficher la confirmation"
                                            title="Afficher/Masquer">
                                            <i class="bi bi-eye-fill" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-gov-green">
                                    <i class="bi bi-shield-lock-fill me-1" aria-hidden="true"></i>
                                    Changer le mot de passe
                                </button>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
