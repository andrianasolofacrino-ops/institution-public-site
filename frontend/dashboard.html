<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h1>Gestion des demandes</h1>
        <span>Bonjour, <strong id="nomUtilisateur">...</strong></span>
        <div style="display:flex; gap:8px;">
            <a href="profil.html" class="btn-profil">Mon profil</a>
            <button class="btn-logout" onclick="logout()">Se déconnecter</button>
        </div>
    </nav>

    <div class="container">

        <!-- MESSAGE RETOUR -->
        <div id="msgDashboard" class="msg-retour"></div>

        <!-- STATISTIQUES -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">Total demandes</div>
            </div>
            <div class="stat-card stat-attente">
                <div class="stat-number" id="statAttente">0</div>
                <div class="stat-label">En attente</div>
            </div>
            <div class="stat-card stat-encours">
                <div class="stat-number" id="statEncours">0</div>
                <div class="stat-label">En cours</div>
            </div>
            <div class="stat-card stat-termine">
                <div class="stat-number" id="statTermine">0</div>
                <div class="stat-label">Terminées</div>
            </div>
        </div>

        <!-- BARRE ACTION + FILTRES -->
        <div class="barre-action">
            <h2>Mes demandes</h2>
            <a href="demande.html" class="btn-nouvelle">+ Nouvelle demande</a>
        </div>

        <!-- FILTRES ET RECHERCHE -->
        <div class="filtres-bar">
            <input
                type="text"
                id="searchInput"
                placeholder="Rechercher une demande..."
                oninput="filtrerDemandes()"
                class="search-input"
            >
            <select id="filtreStatut" onchange="filtrerDemandes()" class="filtre-select">
                <option value="">Tous les statuts</option>
                <option value="En attente">En attente</option>
                <option value="En cours">En cours</option>
                <option value="Terminée">Terminée</option>
                <option value="Refusée">Refusée</option>
            </select>
            <select id="filtreType" onchange="filtrerDemandes()" class="filtre-select">
                <option value="">Tous les types</option>
                <option value="Certificat de résidence">Certificat de résidence</option>
                <option value="Acte de naissance">Acte de naissance</option>
                <option value="Acte de mariage">Acte de mariage</option>
                <option value="Certificat de vie">Certificat de vie</option>
                <option value="Légalisation de document">Légalisation de document</option>
                <option value="Autre demande">Autre demande</option>
            </select>
            <button class="btn-reset" onclick="resetFiltres()">Réinitialiser</button>
        </div>

        <!-- LISTE DES DEMANDES -->
        <div id="listeDemandes">
            <p class="chargement-msg">Chargement...</p>
        </div>

        <!-- PAGINATION -->
        <div class="pagination" id="pagination"></div>

    </div>

    <!-- MODALE MODIFICATION -->
    <div id="modaleModif" class="modale">
        <div class="modale-contenu">
            <h3>Modifier la demande</h3>
            <input type="hidden" id="modifId">

            <label for="modifTitre">Type de demande</label>
            <select id="modifTitre">
                <option value="Certificat de résidence">Certificat de résidence</option>
                <option value="Acte de naissance">Acte de naissance</option>
                <option value="Acte de mariage">Acte de mariage</option>
                <option value="Certificat de vie">Certificat de vie</option>
                <option value="Légalisation de document">Légalisation de document</option>
                <option value="Autre demande">Autre demande</option>
            </select>

            <label for="modifDescription">Description</label>
            <textarea id="modifDescription" placeholder="Description de la demande"></textarea>

            <div class="modale-actions">
                <button class="btn-annuler" onclick="fermerModification()">Annuler</button>
                <button class="btn-sauvegarder" onclick="sauvegarderModification(event)">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- MODALE DÉTAIL -->
    <div id="modaleDetail" class="modale">
        <div class="modale-contenu">
            <h3>Détail de la demande</h3>
            <div id="detailContenu"></div>
            <div class="modale-actions">
                <button class="btn-annuler" onclick="fermerDetail()">Fermer</button>
                <button class="btn-imprimer" onclick="imprimerDemande()">Imprimer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
