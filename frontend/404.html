<!DOCTYPE html>

    <style>
        .page-404 {
            min-height: 100vh;
            display: flex;

            line-height: 1;

        }
        .titre-404 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;

        }
        .desc-404 {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .icon-404 {
            font-size: 64px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }
        .liens-404 {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
