<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — CommuneService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Plus Jakarta Sans',sans-serif;
            background:#F1F5F9;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px;
        }

        .box {
            background:#fff;
            border-radius:24px;
            border:1px solid #E2E8F0;
            box-shadow:0 8px 40px rgba(0,0,0,.08);
            padding:56px 48px;
            text-align:center;
            max-width:500px;
            width:100%;
        }

        /* Icône animée */
        .icon-wrap {
            width:88px; height:88px; border-radius:24px;
            background:#EFF6FF; color:#0B3D91;
            display:flex; align-items:center; justify-content:center;
            font-size:40px; margin:0 auto 28px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform:translateY(0); }
            50%      { transform:translateY(-8px); }
        }

        /* 404 */
        .num {
            font-size:96px; font-weight:800;
            line-height:1; letter-spacing:-4px;
            margin-bottom:8px;
            background:linear-gradient(135deg, #0B3D91 0%, #1565C0 100%);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
        }

        .titre {
            font-size:22px; font-weight:800;
            color:#0D1B2A; margin-bottom:12px;
        }

        .desc {
            font-size:15px; color:#64748B;
            line-height:1.7; margin-bottom:36px;
        }

        /* Boutons */
        .btns {
            display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
            margin-bottom:32px;
        }
        .btn-primary-404 {
            background:#0B3D91; color:#fff;
            border:none; border-radius:10px; padding:13px 24px;
            font-size:14px; font-weight:700; font-family:inherit;
            text-decoration:none; display:inline-flex; align-items:center; gap:8px;
            transition:all .2s; cursor:pointer;
        }
        .btn-primary-404:hover { background:#1565C0; transform:translateY(-2px); box-shadow:0 6px 20px rgba(11,61,145,.3); color:#fff; }
        .btn-secondary-404 {
            background:#F1F5F9; color:#374151;
            border:1.5px solid #E2E8F0; border-radius:10px; padding:13px 24px;
            font-size:14px; font-weight:700; font-family:inherit;
            text-decoration:none; display:inline-flex; align-items:center; gap:8px;
            transition:all .2s;
        }
        .btn-secondary-404:hover { border-color:#94A3B8; color:#0D1B2A; background:#E2E8F0; }

        /* Liens rapides */
        .quick-links {
            border-top:1px solid #F1F5F9; padding-top:24px;
        }
        .quick-title { font-size:12px; font-weight:700; color:#94A3B8; text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }
        .quick-grid { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .quick-link {
            display:inline-flex; align-items:center; gap:6px;
            background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px;
            padding:8px 14px; font-size:13px; font-weight:600; color:#475569;
            text-decoration:none; transition:all .15s;
        }
        .quick-link:hover { background:#EFF6FF; border-color:#BFDBFE; color:#0B3D91; }

        /* Footer */
        .footer-404 {
            margin-top:28px; font-size:12px; color:#94A3B8;
            display:flex; align-items:center; gap:6px; justify-content:center;
        }

        @media (max-width:480px) {
            .box { padding:40px 24px; }
            .num { font-size:72px; }
            .btns { flex-direction:column; align-items:center; }
            .btn-primary-404, .btn-secondary-404 { width:100%; justify-content:center; }
        }
    </style>
</head>
<body>

    <div class="box">

        <div class="icon-wrap">
            <i class="bi bi-building-fill-slash"></i>
        </div>

        <div class="num">404</div>
        <h1 class="titre">Page introuvable</h1>
        <p class="desc">
            La page que vous cherchez n'existe pas<br>ou a été déplacée.
        </p>

        <div class="btns">
            <a href="index.html" class="btn-primary-404">
                <i class="bi bi-house-fill"></i>Retour à l'accueil
            </a>
            <a href="dashboard.html" class="btn-secondary-404">
                <i class="bi bi-grid-fill"></i>Mon tableau de bord
            </a>
        </div>

        <div class="quick-links">
            <div class="quick-title">Accès rapide</div>
            <div class="quick-grid">
                <a href="login.html" class="quick-link">
                    <i class="bi bi-box-arrow-in-right"></i>Connexion
                </a>
                <a href="register.html" class="quick-link">
                    <i class="bi bi-person-plus-fill"></i>Inscription
                </a>
                <a href="demande.html" class="quick-link">
                    <i class="bi bi-file-earmark-plus-fill"></i>Nouvelle demande
                </a>
            </div>
        </div>

    </div>

    <div class="footer-404">
        <i class="bi bi-building-fill"></i>
        CommuneService — Portail Administratif · Madagascar
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
