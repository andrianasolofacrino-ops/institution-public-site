<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle demande</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* ── Navbar ── */
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 { font-size: 17px; }

        .navbar a {
            color: #aed6f1;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar a:hover { color: white; }

        /* ── Contenu ── */
        .container {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .carte {
            background: white;
            border-radius: 10px;
            padding: 36px 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .carte h2 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .carte p.sous-titre {
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
            margin-top: 16px;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            outline: none;
            transition: border 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus { border-color: #3498db; }

        textarea {
            height: 120px;
            resize: vertical;
        }

        /* Sélecteur de type de demande */
        select {
            background: white;
            cursor: pointer;
        }

        .btn-envoyer {
            width: 100%;
            padding: 13px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }

        .btn-envoyer:hover { background: #1a252f; }

        /* Message retour */
        #msgDemande {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 14px;
        }

        .msg-succes { background: #d1e7dd; color: #0a3622; }
        .msg-erreur { background: #f8d7da; color: #842029; }

        .lien-retour {
            text-align: center;
            margin-top: 18px;
        }

        .lien-retour a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }

        .lien-retour a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- ── Navbar ── -->
    <nav class="navbar">
        <h1>Gestion des demandes</h1>
        <a href="dashboard.html">← Retour au tableau de bord</a>
    </nav>

    <!-- ── Contenu ── -->
    <div class="container">
        <div class="carte">

            <h2>📄 Nouvelle demande</h2>
            <p class="sous-titre">Remplissez le formulaire pour soumettre votre demande administrative</p>

            <form onsubmit="envoyerDemande(event)">

                <label for="type">Type de demande</label>
                <select id="type" required>
                    <option value="">-- Choisir un type --</option>
                    <option value="Certificat de résidence">Certificat de résidence</option>
                    <option value="Acte de naissance">Acte de naissance</option>
                    <option value="Acte de mariage">Acte de mariage</option>
                    <option value="Certificat de vie">Certificat de vie</option>
                    <option value="Légalisation de document">Légalisation de document</option>
                    <option value="Autre demande">Autre demande</option>
                </select>

                <label for="description">Description de la demande</label>
                <textarea
                    id="description"
                    placeholder="Décrivez votre demande en détail..."
                    required
                ></textarea>

                <button type="submit" class="btn-envoyer">Envoyer la demande</button>

            </form>

            <!-- Message de retour -->
            <div id="msgDemande"></div>

            <div class="lien-retour">
                <a href="dashboard.html">← Retour au tableau de bord</a>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
