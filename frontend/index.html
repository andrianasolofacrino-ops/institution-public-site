<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Publique — Accueil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
 
        .carte {
            background: white;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
 
        .icone {
            font-size: 48px;
            margin-bottom: 16px;
        }
 
        h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
 
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
 
        .boutons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
 
        .btn-connexion {
            background: #2c3e50;
            color: white;
            padding: 13px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
 
        .btn-connexion:hover { background: #1a252f; }
 
        .btn-inscription {
            background: white;
            color: #2c3e50;
            padding: 13px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #2c3e50;
            transition: all 0.2s;
        }
 
        .btn-inscription:hover {
            background: #2c3e50;
            color: white;
        }
 
        .pied {
            margin-top: 28px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
 
    <div class="carte">
        <div class="icone">🏛️</div>
        <h1>Portail des demandes administratives</h1>
        <p>Bienvenue sur la plateforme de gestion des demandes de la commune. Connectez-vous ou créez un compte pour soumettre vos demandes.</p>
 
        <div class="boutons">
            <a href="login.html" class="btn-connexion">Se connecter</a>
            <a href="register.html" class="btn-inscription">Créer un compte</a>
        </div>
 
        <p class="pied">Commune — Système de gestion 2026</p>
    </div>
 
</body>
</html>
